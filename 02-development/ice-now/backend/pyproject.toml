[project]
name = "ice-now-backend"
version = "0.1.0"
description = "Mock FastAPI backend for the IceNow NHL scoreboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3"
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
