name: pubg-analytics

services:
  app:
    build: .
    image: pubg-analytics:local
    container_name: pubg-analytics-app
    ports:
      - "127.0.0.1:${PUBG_APP_PORT:-8000}:8000"
    environment:
      PUBG_API_KEY: ${PUBG_API_KEY:?Set PUBG_API_KEY in pubg-analytics/.env}
      PUBG_PLATFORM: ${PUBG_PLATFORM:-steam}
      PUBG_MODE: ${PUBG_MODE:-solo-fpp}
      PUBG_API_BASE_URL: ${PUBG_API_BASE_URL:-https://api.pubg.com}
      PUBG_API_TIMEOUT: ${PUBG_API_TIMEOUT:-10}
      DATABASE_URL: ${PUBG_DATABASE_URL:-sqlite:////data/pubg.db}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      APP_ENV: docker
    volumes:
      - pubg-data:/data
    depends_on:
      - otel-collector
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./config/otelcol/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
      - tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
      - blackbox-exporter
      - alertmanager
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - source: on_call_webhook_token
        target: on_call_webhook_token
    depends_on:
      - on-call-agent
    restart: unless-stopped

  on-call-agent:
    image: pubg-analytics:local
    command: ["python", "ops/on_call_agent.py"]
    secrets:
      - source: on_call_webhook_token
        target: on_call_webhook_token
      - source: restart_proxy_token
        target: restart_proxy_token
    depends_on:
      - app
      - restart-proxy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 3

  restart-proxy:
    image: pubg-analytics:local
    command: ["python", "ops/restart_proxy.py"]
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      RESTART_STATE_DATABASE: /data/restart-proxy.sqlite3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - on-call-state:/data
    secrets:
      - source: restart_proxy_token
        target: restart_proxy_token
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 3

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  pubg-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  on-call-state:

secrets:
  on_call_webhook_token:
    file: ${ON_CALL_WEBHOOK_TOKEN_FILE:-./.secrets/alertmanager-webhook-token}
  restart_proxy_token:
    file: ${RESTART_PROXY_TOKEN_FILE:-./.secrets/restart-proxy-token}
