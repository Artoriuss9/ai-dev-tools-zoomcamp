route:
  receiver: pubg-analytics-on-call
  group_by: [alertname, instance]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: pubg-analytics-on-call
    webhook_configs:
      - url: http://on-call-agent:8081/alerts
        send_resolved: true
        timeout: 45s
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/on_call_webhook_token
